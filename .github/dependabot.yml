version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The ESPHome pin in requirements-ci.txt. Its pull requests are a notice plus
  # a CI run (board builds, linker-map checks for phy_guard and timer_guard).
  # No auto-merge: each ESPHome bump needs a hardware test of the bridge before
  # merge. README.md names only the minimum the components require
  # (tools/sync_esphome_min.py), so a bump needs no README edit.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
