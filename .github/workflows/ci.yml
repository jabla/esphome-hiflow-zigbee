name: CI

on:
  # Documentation-only changes need neither the tests nor a firmware build.
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libssl-dev
      - name: Host test suites
        run: make -C test/host test
      - name: Component copies match src/
        run: |
          components/hiflow_ble/sync_core.sh
          git diff --exit-code -- components/
      - name: BLE-only variant matches esp32c6.yaml
        run: |
          python3 tools/make_bleonly_board.py
          git diff --exit-code -- esp32c6-bleonly.yaml

  esphome:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [esp32c6.yaml, esp32c6-bleonly.yaml]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.8.2"
      - name: Cache the ESP-IDF toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}-esphome-2026.8.2
      - name: Compile with the example credentials
        run: |
          cp hiflow_secrets.example.yaml hiflow_secrets.yaml
          esphome compile ${{ matrix.config }}
