# Seeed Studio XIAO ESP32-C6: radio front end.
#
# The board has an FM8625H RF switch (ESPHome aliases RF_SWITCH_EN=GPIO3,
# RF_ANT_SELECT=GPIO14). With the pins left unset the radio path is undefined:
# measured only -94 dBm where a USB dongle at the same spot saw -78 dBm.
#   GPIO3  LOW  = RF switch powered
#   GPIO14 LOW  = internal ceramic antenna, HIGH = external U.FL antenna
# gpio outputs start "off" (LOW, the internal antenna). hiflow_ble sets GPIO14
# once its settings are loaded: `external_antenna` from hiflow_secrets.yaml, or,
# left empty there, ant=ext / ant=int from the settings field over Zigbee. That
# is before the BLE scan and the Zigbee network start. An external antenna
# gained about 19 dB at the reference site.

esp32:
  variant: esp32c6
  # Half the default 160 MHz: the bridge mostly waits for the radio, and the
  # chip runs much cooler.
  cpu_frequency: 80MHZ

substitutions:
  # Zigbee OTA image type of this board ("HX"), see zigbee_ota: in hiflow-zb.yaml.
  ota_image_type: "0x4858"
  # Sleepy end device (zigbee_power in hiflow-zb.yaml), on unless hiflow_secrets.yaml says
  # otherwise.
  sleepy: "true"

output:
  - platform: gpio
    pin:
      number: GPIO3
      mode: {output: true}
    id: rf_switch_en
  - platform: gpio
    pin:
      number: GPIO14
      mode: {output: true}
    id: rf_ant_select

hiflow_ble:
  antenna_select: rf_ant_select
  external_antenna: ${external_antenna}
