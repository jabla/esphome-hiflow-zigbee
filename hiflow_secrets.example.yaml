# Copy to hiflow_secrets.yaml (gitignored). hiflow-zb.yaml includes the file as
# substitutions, so nothing personal ends up in the device config.
#
# The inverter values may stay empty, as here. The bridge then finds the
# inverter by its BLE name, makes up its own login identity and takes the PIN
# over Zigbee ("Settings over Zigbee" in the README). Release images are built
# from this file as it is. A value filled in here wins and stays in the
# bridge's flash, also for a release image installed later.

# Which board runs the bridge. The config pulls in boards/<board>.yaml from it,
# so the same hiflow-zb.yaml serves all supported boards:
#   xiao_esp32c6          Seeed Studio XIAO ESP32-C6 - RF switch, external U.FL
#                         antenna, no display
#   waveshare_c6_lcd147   Waveshare ESP32-C6-LCD-1.47 - on-board 172x320 LCD,
#                         patch antenna only, the external_antenna line below is
#                         unused with it
#   waveshare_h2_zero     Waveshare ESP32-H2-Zero - on-board antenna only, no
#                         display
board: "xiao_esp32c6"

# BLE address of the inverter, e.g. from a BLE scanner app or from Home
# Assistant's Bluetooth panel (the device is advertised as RMI-XXXXXXXXXXXX).
# All zeros: the bridge finds the inverter by its name. With more than one
# inverter in range it waits for sn= in the settings field.
hiflow_mac: "00:00:00:00:00:00"

# The 12 characters after "RMI-" in the inverter's BLE name. The V0 pairing
# derives its key from them. Set it together with hiflow_mac or leave both empty.
hiflow_sn: ""

# The identity the bridge logs in with. Empty: the bridge makes one up and
# keeps it in flash. Coming from the Home Assistant integration ha-hiflow-ble,
# reuse its ble_id (config entry data) and the inverter will not ask for the
# PIN again. `python3 tools/gen_ble_id.py` makes a new one.
hiflow_ble_id: ""

# The Bluetooth connection PIN set in the S-Miles app (not the account
# password). Only sent when the inverter asks for it. Empty: none, unless set
# over Zigbee (pin=).
hiflow_ble_pin: ""

# "true" (the default) makes the bridge a sleepy Zigbee end device: the
# receiver is off between polls and the chip light-sleeps between its work
# (the ESP32-C6-LCD-1.47 by day too: its backlight runs on in light sleep).
# Much cooler, and a first step towards running it on a battery. "false"
# keeps the receiver on all the time. After a change the bridge joins again
# by itself: permit joins in Home Assistant (ZHA: Add device) when it starts
# with the new setting.
sleepy: "true"

# "true" if an external antenna is plugged into the XIAO's U.FL socket,
# "false" for the internal ceramic antenna. Empty: internal until ant=ext in
# the settings field.
external_antenna: ""
