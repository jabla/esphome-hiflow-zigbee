# Copy to hiflow_secrets.yaml (gitignored) and fill in. esp32c6.yaml includes the
# file as substitutions, so nothing personal ends up in the device config.

# BLE address of the inverter, e.g. from a BLE scanner app or from Home
# Assistant's Bluetooth panel (the device is advertised as RMI-XXXXXXXXXXXX).
hiflow_mac: "AA:BB:CC:DD:EE:FF"

# The 12 characters after "RMI-" in the inverter's BLE name. The V0 pairing
# derives its key from them.
hiflow_sn: "XXXXXXXXXXXX"

# The identity the bridge logs in with: generate one with
# `python3 tools/gen_ble_id.py` and keep it. Coming from the Home Assistant
# integration ha-hiflow-ble, reuse its ble_id (config entry data) and the
# inverter will not ask for the PIN again.
hiflow_ble_id: "000000000000000000"

# The Bluetooth connection PIN set in the S-Miles app (not the account
# password). Only sent when the inverter asks for it; leave empty if you never
# set one.
hiflow_ble_pin: ""

# "true" if an external antenna is plugged into the XIAO's U.FL socket,
# "false" for the internal ceramic antenna.
external_antenna: "false"
